<style>
:root{--ink:#163d45;--muted:#637075;--paper:#f7f5ef;--glass:rgba(255,255,255,.76);--line:rgba(17,94,103,.13);--teal:#115e67;--blue:#009bd8;--gold:#92722a;--gold2:#ecd78c;--shadow:0 18px 42px rgba(17,62,69,.14);--ease:cubic-bezier(.2,.8,.2,1);--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;--serif:"DM Serif Display",Georgia,serif}

  return `<section class="diary-top enter"><h1>Дневник</h1><span>${FULL[day]}</span><div class="orn">✦</div></section>${dates()}<div class="people">${['Вадим','Ульяна'].map(x=>`<button data-w="${x}" class="${x===who?'active':''}">${x}</button>`).join('')}</div><div class="info"><h3>Общий дневник</h3><p>${S.imps.length?`Записей: ${S.imps.length}, комментариев: ${S.comments.length}. Всё, что вы сохраняете, видно обоим.`:'Пока нет записей. Первая заметка появится сразу у вас обоих.'}</p></div>${a.map(dcard).join('')||'<div class="empty">В этот день пока нет карточек.</div>'}`}
function trip(){const sec={flights:'Перелёты',hotel_marina:'Отель · JBR',hotel_downtown:'Отель · Downtown',general:'Общее',contacts:'Контакты'};const g={};S.info.forEach(i=>(g[i.section]=g[i.section]||[]).push(i));
  return `<section class="enter"><div class="head"><h2>Поездка</h2><b>31 октября — 7 ноября</b><div class="orn">✦</div></div>${Object.entries(g).map(([s,items],n)=>`<div class="info" style="animation-delay:${n*70}ms"><h3>${e(sec[s]||s)}</h3>${items.map(i=>`<p><b>${e(i.label)}</b><br>${e(i.value||'')}</p>`).join('')}</div>`).join('')}
  <div class="info"><h3>Данные</h3><p>Выгрузка маршрута, дневника и комментариев в Markdown для калибровки.</p><button class="save" id="md">⬇ Выгрузить MD</button><button class="save ghost" id="reload">↻ Обновить</button><p class="hint">${offline?'Сейчас без связи с базой: показана сохранённая копия.':'Связь с общей базой есть. Обновление каждые 10 секунд.'}</p></div></section>`}
function render(){$('#title').textContent={today:'Сегодня',route:'Маршрут',diary:'Дневник',trip:'Поездка'}[v];$('#root').innerHTML=v==='today'?today():v==='route'?route():v==='diary'?diary():trip();$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));heroSwap=false;bind()}
function open(html){$('#panel').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('open')}
function close(){$('#sheet').classList.remove('open')}
function commentsBlock(type,id){const list=cm(type,id);return `<label>Комментарии</label><div class="clist" id="clist">${list.map(c=>`<div class="c ${c.author===who?'me':''}"><b>${e(c.author)}</b>${e(c.body)}<small>${fmt(c.created_at)}</small></div>`).join('')||'<div class="empty" style="padding:8px">Пока тихо.</div>'}</div><div class="crow"><textarea id="cbody" placeholder="Комментарий от ${e(who)}…"></textarea><button id="csend" data-type="${type}" data-id="${e(id)}">↑</button></div>`}
async function sendComment(type,id){const b=$('#cbody').value.trim();if(!b)return;if(String(id).startsWith('seed-'))return toast('Нет связи с базой');try{await api('comments',{method:'POST',body:JSON.stringify({target_type:type,target_id:String(id),author:who,body:b})});await load(true);if(reopen)reopen();const l=$('#clist');if(l)l.scrollIntoView({block:'end',behavior:'smooth'});if(v==='today')render()}catch{toast('Не удалось отправить комментарий')}}
function placeSheet(id){const p=S.places.find(q=>String(q.id)===String(id));if(!p)return;reopen=()=>placeSheet(id);
  open(`<h2>${e(p.title)}</h2><p class="sub">${e(p.time_start||'Время уточняется')} · ${e(AREA[p.area]||'Дубай')} · ${e(p.price_note||'свободно')}\n\n${e(p.notes||'')}</p>
  <label>Статус</label><div class="seg" id="stseg">${Object.entries(STATUS).map(([k,t])=>`<button data-st="${k}" class="${p.status===k?'on':''}">${t}</button>`).join('')}</div>
  ${p.map_url?`<p><a href="${e(p.map_url)}" target="_blank" rel="noopener">Открыть карту</a></p>`:''}${p.ticket_url?`<p><a href="${e(p.ticket_url)}" target="_blank" rel="noopener">Билеты</a></p>`:''}
  ${commentsBlock('place',p.id)}
  <div class="row"><button class="pill solid" id="editPlace">✎ Редактировать</button><button class="pill" id="toDiary">☆ В дневник</button><button class="pill danger" id="delPlace">Удалить</button></div>`);
  $$('#stseg button').forEach(b=>b.onclick=async()=>{try{await api('places?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify({status:b.dataset.st})});$$('#stseg button').forEach(x=>x.classList.toggle('on',x===b));toast('Статус обновлён');load(true)}catch{toast('Не удалось обновить статус')}});
  $('#editPlace').onclick=()=>editPlace(p);$('#toDiary').onclick=()=>{close();v='diary';render()};
  $('#delPlace').onclick=async()=>{if(!confirm('Удалить карточку из общего маршрута?'))return;try{await api('places?id=eq.'+encodeURIComponent(p.id),{method:'DELETE'});close();toast('Карточка удалена');await load()}catch{toast('Не удалось удалить')}};
  bindSheet()}
function editPlace(p){const isNew=!p;p=p||{day:D[day],time_start:'',title:'',area:'marina',kind:'other',daypart:'day',price_note:'',notes:'',status:'planned',is_backup:false};
  open(`<h2>${isNew?'Новая идея':'Редактировать'}</h2><p class="sub">${isNew?'Появится у обоих сразу после сохранения.':'Изменения увидят оба.'}</p>
  <label>Название</label><input id="f-title" value="${e(p.title)}">
  <label>День</label><select id="f-day">${D.map((d,i)=>`<option value="${d}" ${p.day===d?'selected':''}>${FULL[i]}</option>`).join('')}</select>
  <label>Время</label><input id="f-time" type="time" value="${e(p.time_start||'')}">
  <label>Район</label><select id="f-area">${Object.entries(AREA).map(([k,t])=>`<option value="${k}" ${p.area===k?'selected':''}>${t}</option>`).join('')}</select>
  <label>Тип</label><select id="f-kind">${Object.keys(KIND).map(k=>`<option value="${k}" ${p.kind===k?'selected':''}>${KIND[k]} ${k}</option>`).join('')}</select>
  <label>Цена / условие</label><input id="f-price" value="${e(p.price_note||'')}">
  <label>Подробности</label><textarea id="f-notes">${e(p.notes||'')}</textarea>
  <label><input type="checkbox" id="f-backup" ${p.is_backup?'checked':''} style="width:auto;margin-right:8px">Резерв / идея (не в основной программе)</label>
  <div class="row"><button class="pill solid" id="f-save">Сохранить</button><button class="pill" id="f-cancel">Отмена</button></div>`);
  $('#f-cancel').onclick=()=>isNew?close():placeSheet(p.id);
  $('#f-save').onclick=async()=>{const body={day:$('#f-day').value,time_start:$('#f-time').value||null,title:$('#f-title').value.trim(),area:$('#f-area').value,kind:$('#f-kind').value,price_note:$('#f-price').value.trim()||null,notes:$('#f-notes').value.trim()||null,is_backup:$('#f-backup').checked};if(!body.title)return toast('Укажите название');
    try{if(isNew){body.status='planned';body.daypart='day';body.sort_order=Math.max(0,...S.places.map(x=>x.sort_order||0))+1;await api('places',{method:'POST',body:JSON.stringify(body)})}else await api('places?id=eq.'+encodeURIComponent(p.id),{method:'PATCH',body:JSON.stringify(body)});close();toast(isNew?'Добавлено в общий маршрут':'Сохранено');await load()}catch(x){toast('Не удалось сохранить: '+x.message.slice(0,80))}}}
function noteSheet(){const d=dayRow(day);open(`<h2>Заметка дня</h2><p class="sub">${FULL[day]} · ${e(d.title)}</p><textarea id="n-body" style="min-height:140px">${e(d.notes||'')}</textarea><div class="row"><button class="pill solid" id="n-save">Сохранить</button><button class="pill" id="n-cancel">Отмена</button></div>`);$('#n-cancel').onclick=close;$('#n-save').onclick=()=>saveDay({notes:$('#n-body').value.trim()||null},'Заметка сохранена')}
async function saveDay(patch,msg){const d=dayRow(day);try{const r=await api('days?day=eq.'+D[day],{method:'PATCH',body:JSON.stringify(patch)});if(!r||!r.length)await api('days',{method:'POST',body:JSON.stringify({day:D[day],title:d.title,subtitle:d.subtitle,...patch})});close();toast(msg);await load()}catch(x){toast('Не удалось сохранить: '+x.message.slice(0,80))}}
function dayCommentsSheet(){reopen=dayCommentsSheet;open(`<h2>Комментарии к дню</h2><p class="sub">${FULL[day]} · ${e(dayRow(day).title)}</p>${commentsBlock('day',D[day])}`);bindSheet()}
function impCommentsSheet(id){const m=S.imps.find(x=>x.id===id);if(!m)return;reopen=()=>impCommentsSheet(id);const p=S.places.find(q=>q.id===m.place_id);open(`<h2>Обсуждение записи</h2><p class="sub"><b>${e(m.author)}</b> о «${e(p?.title||'')}»${m.rating?' · '+'★'.repeat(m.rating):''}\n${e(m.body||'')}</p>${commentsBlock('impression',id)}`);bindSheet()}
function md(){const L=[];L.push('# Дубай · 31 октября — 7 ноября 2026','',`Выгрузка: ${new Date().toLocaleString('ru-RU')}. Устройство: ${who}.`,'','## Поездка','');S.info.forEach(i=>L.push(`- **${i.label}**: ${i.value||''}`));
  D.forEach((d,i)=>{const r=dayRow(i);L.push('',`## День ${i+1} · ${FULL[i]} · ${r.title}`,'',`_${r.subtitle||''}_`,r.notes?`\n**Заметка дня:** ${r.notes}`:'');
    cm('day',d).forEach(c=>L.push(`> 💬 ${c.author} (${fmt(c.created_at)}): ${c.body}`));
    S.places.filter(p=>p.day===d).forEach(p=>{L.push('',`### ${p.time_start||'—'} · ${p.title}${p.is_backup?' (резерв)':''}`,`- Статус: ${STATUS[p.status]||p.status}; район: ${AREA[p.area]||p.area}; тип: ${p.kind}; цена: ${p.price_note||'—'}${p.price_aed?` (${p.price_aed} AED)`:''}`,p.notes?`- Подробности: ${p.notes}`:'');
      S.imps.filter(m=>m.place_id===p.id).forEach(m=>{L.push(`- ★ ${m.author}${m.rating?' '+'★'.repeat(m.rating):''}: ${m.body||''}`);cm('impression',m.id).forEach(c=>L.push(`  - 💬 ${c.author} (${fmt(c.created_at)}): ${c.body}`))});
      cm('place',p.id).forEach(c=>L.push(`- 💬 ${c.author} (${fmt(c.created_at)}): ${c.body}`))})});
  const t=L.join('\n'),name=`dubai-${new Date().toISOString().slice(0,10)}.md`;
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([t],name,{type:'text/markdown'})]})){navigator.share({files:[new File([t],name,{type:'text/markdown'})],title:'Дубай · выгрузка'}).catch(()=>{});return}
  const u=URL.createObjectURL(new Blob([t],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function bindSheet(){const s=$('#csend');if(s)s.onclick=()=>sendComment(s.dataset.type,s.dataset.id)}
function bind(){
  $$('[data-day]').forEach(x=>x.onclick=()=>{day=+x.dataset.day;heroSwap=true;render();if(v==='today')scrollTo({top:0,behavior:'smooth'})});
  $$('[data-go]').forEach(x=>x.onclick=()=>{day=+x.dataset.go;v='today';heroSwap=true;render();scrollTo({top:0,behavior:'smooth'})});
  $$('.nav button').forEach(x=>x.onclick=()=>{v=x.dataset.v;render();scrollTo({top:0,behavior:'smooth'})});
  $$('.event').forEach(x=>x.onclick=()=>placeSheet(x.dataset.id));
  const nb=$('#noteBtn');if(nb)nb.onclick=noteSheet;const dc=$('#dayCmt');if(dc)dc.onclick=dayCommentsSheet;
  $$('[data-w]').forEach(x=>x.onclick=()=>{who=x.dataset.w;localStorage.who=who;render()});
  $$('[data-s]').forEach(x=>x.onclick=()=>{const box=x.closest('.stars');box.dataset.rating=x.dataset.s;box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.s<=+x.dataset.s))});
  $$('[data-save]').forEach(x=>x.onclick=()=>saveImp(x));
  $$('[data-del]').forEach(x=>x.onclick=async()=>{if(!confirm('Удалить вашу запись?'))return;try{await api('impressions?id=eq.'+encodeURIComponent(x.dataset.del),{method:'DELETE'});toast('Запись удалена');await load()}catch{toast('Не удалось удалить')}});
  $$('[data-ic]').forEach(x=>x.onclick=()=>impCommentsSheet(x.dataset.ic));
  const m=$('#md');if(m)m.onclick=md;const r=$('#reload');if(r)r.onclick=()=>load().then(()=>toast('Обновлено'));
  const hero=$('.hero img');if(hero&&!matchMedia('(prefers-reduced-motion:reduce)').matches){onscroll=()=>{const y=Math.min(scrollY,400);hero.style.transform=`scale(1.06) translateY(${y*.18}px)`}}else onscroll=null;
}
async function saveImp(btn){const id=btn.dataset.save,noteId=btn.dataset.note,body=$(`[data-n="${CSS.escape(id)}"]`).value.trim(),rating=+($(`[data-k="${CSS.escape(id)}"]`).dataset.rating||0)||null;if(String(id).startsWith('seed-'))return toast('Нет связи с базой: запись сохранить нельзя');if(!body&&!rating)return toast('Напишите пару слов или поставьте оценку');
  try{const p={place_id:id,author:who,rating,body:body||null};if(noteId)await api('impressions?id=eq.'+encodeURIComponent(noteId),{method:'PATCH',body:JSON.stringify(p)});else await api('impressions',{method:'POST',body:JSON.stringify(p)});toast('Сохранено в общий дневник');await load()}catch(x){toast('Не удалось сохранить: '+x.message.slice(0,80))}}
$('#compose').onclick=()=>editPlace(null);
$('#sheet').onclick=x=>{if(x.target.id==='sheet')close()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
const t0=Date.now();
load().finally(()=>{const wait=Math.max(0,1500-(Date.now()-t0));setTimeout(()=>$('#loader').classList.add('hide'),wait)});
setInterval(()=>load(true),10000);
</script></body></html>
