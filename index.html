, "is_backup": false, "status": "plan"}, {"day_date": "2026-11-07", "sort": 2, "title": "Гала: Thiptara", "subtitle": "Тайская терраса у воды, шоу перед столом", "time_label": "19:30", "area": "Palace Downtown", "image_url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/The_Dubai_Fountain_%26_Burj_Khalifa_Pixabay.jpg/1920px-The_Dubai_Fountain_%26_Burj_Khalifa_Pixabay.jpg", "details": {"чек": "мин. 400 AED/чел на столах с видом", "бронь": "SevenRooms за неделю, пометка outdoor fountain view"}, "is_backup": false, "status": "plan"}, {"day_date": "2026-11-07", "sort": 3, "title": "Абра по озеру фонтанов", "subtitle": "Лодка под башней во время шоу", "time_label": "20:30", "area": "Downtown", "image_url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Boat_on_the_Burj_Khalifa_Lake_at_night.jpg/1920px-Boat_on_the_Burj_Khalifa_Lake_at_night.jpg", "details": {"цена": "68–90 AED/чел"}, "is_backup": false, "status": "plan"}, {"day_date": "2026-11-07", "sort": 50, "title": "Dubai Opera", "subtitle": "Вместо гала, если даты совпадут", "time_label": "Вечер", "area": "Downtown", "image_url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/The_Dubai_Fountain_%26_Burj_Khalifa_Pixabay.jpg/1920px-The_Dubai_Fountain_%26_Burj_Khalifa_Pixabay.jpg", "details": {"билеты": "от 290–350 AED"}, "is_backup": true, "status": "plan"}, {"day_date": "2026-11-05", "sort": 51, "title": "Dubai Canal, Business Bay", "subtitle": "Водопад с моста", "time_label": "Вечер", "area": "Business Bay", "image_url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Boat_on_the_Burj_Khalifa_Lake_at_night.jpg/1920px-Boat_on_the_Burj_Khalifa_Lake_at_night.jpg", "details": {}, "is_backup": true, "status": "plan"}, {"day_date": "2026-11-05", "sort": 52, "title": "Time Out Market", "subtitle": "17 кухонь с террасой на фонтаны, приходить до 18:30", "time_label": "18:00", "area": "Souk Al Bahar", "image_url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/The_Dubai_Fountain_%26_Burj_Khalifa_Pixabay.jpg/1920px-The_Dubai_Fountain_%26_Burj_Khalifa_Pixabay.jpg", "details": {"бюджет": "200–300 AED"}, "is_backup": true, "status": "plan"}, {"day_date": "2026-11-06", "sort": 53, "title": "Бурдж-Халифа At the Top", "subtitle": "Если не были", "time_label": "Закат", "area": "Downtown", "image_url": "cover.jpg", "details": {"цена": "от ~43 USD заранее"}, "is_backup": true, "status": "plan"}, {"day_date": "2026-11-02", "sort": 54, "title": "Абра по каналам Madinat Jumeirah", "subtitle": "Резерв вместо абры по Марине", "time_label": "Вечер", "area": "Джумейра", "image_url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Canal_at_Madinat_Jumeirah_%283050841830%29.jpg/1920px-Canal_at_Madinat_Jumeirah_%283050841830%29.jpg", "details": {"цена": "~100 AED/чел, проверить"}, "is_backup": true, "status": "plan"}, {"day_date": "2026-10-31", "sort": 55, "title": "Crowne Plaza Marina / Mövenpick JBR", "subtitle": "Запасные отели, если Sofitel дорог", "time_label": "—", "area": "Марина / JBR", "image_url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Dubai_Marina_Skyline_93.jpg/1920px-Dubai_Marina_Skyline_93.jpg", "details": {"цена": "~90 тыс. ₽"}, "is_backup": true, "status": "plan"}];
const INFO = {"Перелёт": "31 октября → 7 ноября, Москва – Дубай, утренний вылет. Кандидаты: Аэрофлот ~150 тыс. ₽, flydubai Value, Emirates от ~140 тыс. ₽. Решение до 15 октября.", "Отели": "Sofitel Dubai Jumeirah Beach, 31 окт – 4 ноя, ~128 тыс. ₽, гибкий тариф. Downtown у Dubai Mall, 4 – 7 ноя, до ~50 тыс. ₽, невозвратный.", "Бюджет активностей": "Ориентир на двоих без отелей и перелёта: ~4 800–6 800 AED, ~105–150 тыс. ₽. Курс для расчётов 1 AED ≈ 22 ₽.", "Пляж": "The Beach / Sea Breeze. Вход бесплатный, набор Sofitel на стойке SoFit до 10:00. Ноябрь: воздух ~31°C, вода ~28°C, возможны медузы.", "Открытые вопросы": "Перелёт; тариф Sofitel; отель Downtown; статус Ain Dubai за 3–5 дней; часы Global Village; бронь Thiptara; даты Dubai Opera."};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let days=[], items=[], notes=[], view='today', curDay=null, who=localStorage.getItem('who')||'Вадим';
const $=s=>document.querySelector(s); const app=$('#app');
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmt=d=>{const x=new Date(d+'T00:00:00');return x.getDate()+' '+MONTHS[x.getMonth()];};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400);}
async function load(){
  const [d,i,n]=await Promise.all([sb.from('trip_days').select('*').order('day_date'),sb.from('trip_items').select('*').order('day_date').order('sort'),sb.from('trip_notes').select('*').order('created_at')]);
  const err=d.error||i.error||n.error; if(err){toast('Ошибка базы: '+err.message);console.error(err);return;}
  days=d.data;items=i.data;notes=n.data;
  if(!curDay&&days.length){const today=new Date().toISOString().slice(0,10);curDay=(days.find(x=>x.day_date>=today)||days[0]).day_date;}
  render();
}
const dayItems=dd=>items.filter(x=>x.day_date===dd).sort((a,b)=>a.sort-b.sort);
const top=(title,left='<div class="ic" style="font-family:Amiri,serif;color:var(--gold)">دبي</div>')=>`<div class="top">${left}<div class="pill">${title}</div><div class="ic o">✦</div></div>`;
const seg=()=>`<div class="seg">${days.map(d=>`<button class="${d.day_date===curDay?'on':''}" onclick="curDay='${d.day_date}';render()">${d.weekday} ${new Date(d.day_date+'T00:00:00').getDate()}</button>`).join('')}</div>`;
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(!days.length&&view!=='more'){app.innerHTML=top('Дубай')+`<div class="wrap"><div class="banner"><img src="${COVER}" alt=""><div class="ov"></div><div class="in"><div class="ar">دبي</div><h1>Дубай</h1><p>31 октября — 7 ноября</p></div></div><p style="color:var(--muted);text-align:center;margin:20px">План пока пуст. Откройте «Ещё» и нажмите «Загрузить стартовый план».</p></div>`;return;}
  ({today:renderToday,route:renderRoute,diary:renderDiary,more:renderMore})[view]();
}
function stepHtml(it){
  const det=Object.entries(it.details||{}).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');
  return `<div class="step ${it.status==='done'?'done':''} ${it.is_backup?'bk':''}" onclick="this.classList.toggle('open')">
   <div class="dot">${it.status==='done'?'✓':'✦'}</div><div class="body">
   <div class="t">${esc(it.time_label)}${it.area?' · '+esc(it.area):''}</div><div class="n">${esc(it.title)}</div><div class="s">${esc(it.subtitle)}</div>
   ${det?`<div class="details">${det}</div>`:''}
   <div class="act" onclick="event.stopPropagation()">
     <button class="btn" onclick="move(${it.id},-1)">↑</button><button class="btn" onclick="move(${it.id},1)">↓</button>
     <button class="btn" onclick="toggleDone(${it.id})">${it.status==='done'?'Вернуть':'Сделано'}</button>
     <button class="btn" onclick="toggleBackup(${it.id})">${it.is_backup?'В план':'В резерв'}</button>
     <select style="width:auto;margin:0;padding:8px 10px;border-radius:999px" onchange="moveDay(${it.id},this.value)"><option value="">Перенести…</option>${days.filter(d=>d.day_date!==it.day_date).map(d=>`<option value="${d.day_date}">${d.weekday} ${fmt(d.day_date)}</option>`).join('')}</select>
     <button class="btn b" onclick="goDiary('${it.day_date}',${it.id})">Впечатление</button>
     <button class="btn d" onclick="delItem(${it.id})">Удалить</button>
   </div></div><div class="chev">›</div></div>`;
}
function goDiary(dd,id){view='diary';curDay=dd;render();setTimeout(()=>document.getElementById('nf'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),60);}
function renderToday(){
  const d=days.find(x=>x.day_date===curDay)||days[0]; const all=dayItems(d.day_date); const its=all.filter(x=>!x.is_backup); const bks=all.filter(x=>x.is_backup); const idx=days.indexOf(d)+1;
  const img=idx===1?COVER:(its.find(x=>x.image_url)?.image_url||COVER);
  app.innerHTML=top(`${d.weekday}, ${fmt(d.day_date)}`)+seg()+`<div class="wrap">
   <div class="banner"><img src="${img}" alt=""><div class="ov"></div><div class="in"><span class="tag">ДЕНЬ ${idx} ИЗ ${days.length}</span><div class="ar">دبي</div><h1>${esc(d.title)}</h1><p>${esc(d.intro)}</p></div></div>
   <div class="h-serif o">Программа дня</div><div class="rule">✦</div>
   <div class="list">${its.map(stepHtml).join('')||'<div class="step"><div class="body"><div class="s">На этот день пока ничего нет.</div></div></div>'}</div>
   ${bks.length?`<div class="h-serif">Резерв</div><div class="list">${bks.map(stepHtml).join('')}</div>`:''}
   <div class="prompt" onclick="view='diary';render()"><div class="em">✎</div><div><b>Что хочется запомнить об этом дне?</b><span>Нажмите, чтобы записать впечатление</span></div></div>
   <div class="row" style="margin-top:14px"><input id="newT" placeholder="Добавить своё место" style="flex:1;border-radius:999px"><button class="btn p" onclick="addItem('${d.day_date}')">+</button></div>
  </div>`;
}
function renderRoute(){
  app.innerHTML=top('Маршрут')+`<div class="wrap"><div class="h-serif">Восемь дней<small>ثمانية أيام</small></div><div class="rule">✦</div>
  ${days.map((d,i)=>{const its=dayItems(d.day_date).filter(x=>!x.is_backup);const h=i===0?COVER:(its.find(x=>x.image_url)?.image_url||COVER);return `<div class="card" onclick="curDay='${d.day_date}';view='today';render();window.scrollTo(0,0)"><img src="${h}" alt=""><div class="ov"></div><div class="cap"><span>ДЕНЬ ${i+1} · ${d.weekday} ${fmt(d.day_date)}</span><b>${esc(d.title)}</b><span>${its.map(x=>esc(x.title)).join(' · ')}</span></div></div>`}).join('')}</div>`;
}
function renderDiary(){
  const d=days.find(x=>x.day_date===curDay)||days[0]; const its=dayItems(d.day_date);
  app.innerHTML=top('Дневник')+seg()+`<div class="wrap"><div class="h-serif">${esc(d.title||fmt(d.day_date))}</div><div class="rule">✦</div>
  <div class="seg" style="margin:14px 0">${['Вадим','Ульяна'].map(w=>`<button class="${who===w?'on':''}" onclick="who='${w}';localStorage.setItem('who','${w}');render()">${w}</button>`).join('')}</div>
  ${its.map(it=>{const ns=notes.filter(n=>n.item_id===it.id);return `<div class="note" id="nf${it.id}"><h4>${esc(it.title)}</h4><div class="m">${esc(it.time_label)} · ${esc(it.area)}</div>
   ${ns.map(n=>`<p><span class="who">${esc(n.author)}</span>${n.rating?' · <span style="color:var(--gold)">'+'★'.repeat(n.rating)+'</span>':''}<br>${esc(n.body)}</p>`).join('')}
   <div class="stars" id="st${it.id}">${[1,2,3,4,5].map(k=>`<span onclick="rate(${it.id},${k})">★</span>`).join('')}</div>
   <textarea id="tx${it.id}" rows="3" placeholder="Впечатление, совет себе на будущее, что понравилось или нет"></textarea>
   <button class="btn p" onclick="saveNote(${it.id})">Сохранить</button></div>`}).join('')}</div>`;
}
function renderMore(){
  app.innerHTML=top('Вадим и Ульяна')+`<div class="wrap">
  <div class="kv"><span>Дней: ${days.length}<small>карточек ${items.length} · записей ${notes.length}</small></span><span style="font-family:Amiri,serif;color:var(--gold);font-size:22px">دبي</span></div>
  <div class="h-serif">Рамка поездки</div><div class="rule">✦</div>
  ${Object.entries(INFO).map(([k,v])=>`<div class="note"><h4>${esc(k)}</h4><p style="color:var(--muted)">${esc(v)}</p></div>`).join('')}
  <div class="h-serif">Обслуживание</div><div class="rule">✦</div>
  <div class="note"><h4>Экспорт в Markdown</h4><p style="color:var(--muted)">Маршрут в итоговом порядке, статусы, впечатления и оценки.</p><button class="btn p" onclick="exportMD()">Скачать .md</button></div>
  <div class="note"><h4>Стартовый план</h4><p style="color:var(--muted)">Загружает 8 дней и ${STARTER_ITEMS.length} карточек с фотографиями. Запускать один раз.</p><button class="btn" onclick="loadStarter()">Загрузить стартовый план</button></div></div>`;
}
const ratings={};
function rate(id,k){ratings[id]=k;document.querySelectorAll('#st'+id+' span').forEach((s,i)=>s.classList.toggle('on',i<k));}
async function saveNote(id){const body=$('#tx'+id).value.trim();if(!body&&!ratings[id])return toast('Пустая запись');const {error}=await sb.from('trip_notes').insert({item_id:id,author:who,rating:ratings[id]||null,body});if(error)return toast('Ошибка: '+error.message);delete ratings[id];toast('Сохранено');load();}
async function move(id,dir){const it=items.find(x=>x.id===id);const list=dayItems(it.day_date).filter(x=>x.is_backup===it.is_backup);const i=list.indexOf(it),j=i+dir;if(j<0||j>=list.length)return;const o=list[j];await Promise.all([sb.from('trip_items').update({sort:o.sort}).eq('id',it.id),sb.from('trip_items').update({sort:it.sort}).eq('id',o.id)]);load();}
async function moveDay(id,dd){if(!dd)return;const n=dayItems(dd).length+1;const {error}=await sb.from('trip_items').update({day_date:dd,sort:n}).eq('id',id);if(error)return toast(error.message);toast('Перенесено');load();}
async function toggleDone(id){const it=items.find(x=>x.id===id);await sb.from('trip_items').update({status:it.status==='done'?'plan':'done'}).eq('id',id);load();}
async function toggleBackup(id){const it=items.find(x=>x.id===id);await sb.from('trip_items').update({is_backup:!it.is_backup}).eq('id',id);load();}
async function delItem(id){if(!confirm('Удалить карточку и её записи?'))return;await sb.from('trip_items').delete().eq('id',id);load();}
async function addItem(dd){const t=$('#newT').value.trim();if(!t)return;const {error}=await sb.from('trip_items').insert({day_date:dd,sort:dayItems(dd).length+1,title:t,is_backup:false,status:'plan',details:{}});if(error)return toast(error.message);load();}
async function loadStarter(){if(items.length&&!confirm('В базе уже есть карточки. Добавить стартовый план ещё раз?'))return;
  let r=await sb.from('trip_days').upsert(STARTER_DAYS,{onConflict:'day_date'});if(r.error)return toast('Дни: '+r.error.message);
  r=await sb.from('trip_items').insert(STARTER_ITEMS);if(r.error)return toast('Карточки: '+r.error.message);toast('Стартовый план загружен');load();}
function exportMD(){let md=`# Дубай, 31 октября — 7 ноября 2026\n\n`;days.forEach((d,i)=>{md+=`## День ${i+1}. ${d.weekday} ${fmt(d.day_date)} — ${d.title||''}\n${d.intro||''}\n\n`;dayItems(d.day_date).forEach(it=>{md+=`### ${it.title}${it.is_backup?' (резерв)':''}${it.status==='done'?' ✓':''}\n${it.time_label?'Время: '+it.time_label+'. ':''}${it.area?'Район: '+it.area+'. ':''}${it.subtitle||''}\n`;Object.entries(it.details||{}).forEach(([k,v])=>md+=`- ${k}: ${v}\n`);notes.filter(n=>n.item_id===it.id).forEach(n=>md+=`\n> **${n.author}**${n.rating?' · '+n.rating+'/5':''}: ${n.body||''}\n`);md+='\n';});});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='dubai-2026.md';a.click();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0)});
load();
</script></body></html>
