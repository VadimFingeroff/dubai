function renderRoute(){
  app.innerHTML=hdr('Маршрут')+`<div class="wrap"><div class="h-serif">Восемь дней<small>ثمانية أيام</small></div><div class="rule">✦</div>
  ${days.map((d,i)=>{const its=dayItems(d.day_date).filter(x=>!x.is_backup);const v=its.filter(x=>x.status==='done').length;return `<div class="card fade" style="--i:${i}" onclick="view='today';setDay('${d.day_date}')">${imgTag(heroFor(d.day_date))}<div class="ov"></div><div class="num">${String(i+1).padStart(2,'0')}</div>${v?`<div class="st">★ ${v}/${its.length}</div>`:''}<div class="cap"><span>${d.weekday} · ${fmt(d.day_date)}</span><b>${esc(d.title)}</b><span>${its.map(x=>emo(x.title)+' '+esc(x.title)).join(' · ')}</span></div></div>`}).join('')}</div>`;
}
function renderDiary(){
  const d=days.find(x=>x.day_date===curDay)||days[0]; const its=dayItems(d.day_date).filter(x=>!x.is_backup);
  app.innerHTML=hdr('Дневник')+seg()+`<div class="wrap"><div class="h-serif">${esc(d.title||fmt(d.day_date))}<small>${d.weekday}, ${fmt(d.day_date)}</small></div><div class="rule">✦</div>
  <div class="seg" style="margin:14px 0">${['Вадим','Ульяна'].map(w=>`<button class="${who===w?'on':''}" onclick="who='${w}';localStorage.setItem('who','${w}');render()">${w}</button>`).join('')}</div>
  ${its.map((it,i)=>{const ns=notes.filter(n=>n.item_id===it.id);return `<div class="note fade" style="--i:${i}" id="nf${it.id}"><div class="dh">${imgTag(it.image_url)}<div><h4>${emo(it.title)} ${esc(it.title)}</h4><div class="m">${esc(it.time_label)} · ${esc(it.area)}${it.status==='done'?' · <span style="color:var(--gold)">★ побывали</span>':''}</div></div></div>
   ${ns.map(n=>`<div class="q">«${esc(n.body)}»</div><p style="font-size:13px;color:var(--muted)"><span class="who">${esc(n.author)}</span>${n.rating?' · <span style="color:var(--gold)">'+'★'.repeat(n.rating)+'</span>':''}</p>`).join('')}
   <div class="stars" id="st${it.id}">${[1,2,3,4,5].map(k=>`<span onclick="rate(${it.id},${k})">★</span>`).join('')}</div>
   <textarea id="tx${it.id}" rows="3" placeholder="Как это было? Что запомнилось, что посоветовать себе в следующий раз"></textarea>
   <button class="btn p" onclick="saveNote(${it.id})">Сохранить в дневник</button></div>`}).join('')}</div>`;
}
function renderMore(){
  const v=items.filter(x=>x.status==='done').length;
  app.innerHTML=hdr('Вадим и Ульяна')+`<div class="wrap">
  <div class="kv"><span>${days.length} дней · ${items.filter(x=>!x.is_backup).length} мест<small>побывали ${v} · записей в дневнике ${notes.length}</small></span><span style="font-family:Amiri,serif;color:var(--gold);font-size:22px">دبي</span></div>
  <div class="h-serif">Рамка поездки</div><div class="rule">✦</div>
  ${Object.entries(INFO).map(([k,v],i)=>`<div class="note fade" style="--i:${i}"><h4>${esc(k)}</h4><p style="color:var(--muted)">${esc(v)}</p></div>`).join('')}
  <div class="h-serif">Служебное</div><div class="rule">✦</div>
  <div class="note"><h4>Экспорт в Markdown</h4><p style="color:var(--muted)">Маршрут в итоговом порядке, отметки и впечатления.</p><button class="btn p" onclick="exportMD()">Скачать .md</button></div>
  <div class="note"><h4>Стартовый план</h4><p style="color:var(--muted)">Загружает 8 дней и ${STARTER_ITEMS.length} карточек. Нужен один раз.</p><button class="btn" onclick="loadStarter()">Загрузить стартовый план</button></div></div>`;
}
function showSheet(inner){$('#sheet').innerHTML='<div class="grab"></div>'+inner;$('#sheet').classList.add('on');$('#sbg').classList.add('on');}
function closeSheet(){$('#sheet').classList.remove('on');$('#sbg').classList.remove('on');}
function openSheet(id){const it=items.find(x=>x.id===id);const others=days.filter(d=>d.day_date!==it.day_date);
  showSheet(`<h3>${emo(it.title)} ${esc(it.title)}</h3><div class="sub">Перенести на другой день</div><div class="dayrow">${others.map(d=>`<button class="btn" onclick="moveDay(${id},'${d.day_date}')">${d.weekday} ${new Date(d.day_date+'T00:00:00').getDate()}</button>`).join('')}</div>
  <div class="opt" onclick="setItemPhoto(${id})"><i>✦</i>Сменить фото карточки</div>
  <div class="opt" onclick="move(${id},-1)"><i>↑</i>Поднять выше</div><div class="opt" onclick="move(${id},1)"><i>↓</i>Опустить ниже</div>
  <div class="opt" onclick="toggleBackup(${id})"><i>${it.is_backup?'✦':'◌'}</i>${it.is_backup?'Вернуть в программу':'Отложить на всякий случай'}</div>
  <div class="opt red" onclick="delItem(${id})"><i>✕</i>Убрать из поездки</div>`);}
function heroSheet(dd){const d=days.find(x=>x.day_date===dd);const cur=heroFor(dd);const pool=[];const seen=new Set();
  [COVER,...items.map(x=>x.image_url)].forEach((u,k)=>{if(u&&!seen.has(u)){seen.add(u);const it=items.find(x=>x.image_url===u);pool.push([u,k===0?'Марина':(it?it.title:'')]);}});
  showSheet(`<h3>Фото дня · ${esc(d.title)}</h3><div class="sub">Выберите из фотографий поездки или вставьте свою ссылку</div>
  <div class="grid">${pool.map(([u,t])=>`<div class="${u===cur?'cur':''}" onclick="setHero('${dd}','${esc(u)}')"><img src="${esc(u)}" loading="lazy"><span>${esc(t)}</span></div>`).join('')}</div>
  <div class="opt" onclick="setHeroUrl('${dd}')"><i>🔗</i>Вставить ссылку на фото</div>
  ${d.hero_url?`<div class="opt" onclick="setHero('${dd}',null)"><i>↺</i>Вернуть автоматический выбор</div>`:''}`);}
async function setHero(dd,url){closeSheet();const {error}=await sb.from('trip_days').update({hero_url:url}).eq('day_date',dd);if(error)return toast('Ошибка: '+error.message);toast(url?'Фото дня обновлено':'Фото выбирается автоматически');load();}
function setHeroUrl(dd){const u=prompt('Ссылка на фотографию (jpg или png, начинается с https://)');if(!u)return;if(!/^https?:\/\//.test(u))return toast('Нужна ссылка, начинающаяся с https://');setHero(dd,u.trim());}
async function setItemPhoto(id){closeSheet();const it=items.find(x=>x.id===id);const u=prompt('Ссылка на фотографию для карточки «'+it.title+'»',it.image_url||'');if(u===null)return;const {error}=await sb.from('trip_items').update({image_url:u.trim()||null}).eq('id',id);if(error)return toast('Ошибка: '+error.message);toast('Фото карточки обновлено');load();}
function parallax(){const b=document.querySelector('.banner img.px');if(!b)return;const y=Math.max(0,window.scrollY);b.style.transform=`translateY(${Math.min(y*0.3,180)}px)`;}
window.addEventListener('scroll',()=>requestAnimationFrame(parallax),{passive:true});
let tx0=null,ty0=null;document.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(tx0===null||!['today','diary'].includes(view))return;const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;tx0=null;if(Math.abs(dx)<70||Math.abs(dy)>50||$('#sheet').classList.contains('on'))return;const i=days.findIndex(d=>d.day_date===curDay);const j=i+(dx<0?1:-1);if(j>=0&&j<days.length)setDay(days[j].day_date);},{passive:true});
const ratings={};
function rate(id,k){ratings[id]=k;document.querySelectorAll('#st'+id+' span').forEach((s,i)=>s.classList.toggle('on',i<k));}
async function saveNote(id){const body=$('#tx'+id).value.trim();if(!body&&!ratings[id])return toast('Напишите пару слов');const {error}=await sb.from('trip_notes').insert({item_id:id,author:who,rating:ratings[id]||null,body});if(error)return toast('Ошибка: '+error.message);delete ratings[id];toast('В дневнике');load();}
async function move(id,dir){closeSheet();const it=items.find(x=>x.id===id);const list=dayItems(it.day_date).filter(x=>x.is_backup===it.is_backup);const i=list.indexOf(it),j=i+dir;if(j<0||j>=list.length)return;const o=list[j];await Promise.all([sb.from('trip_items').update({sort:o.sort}).eq('id',it.id),sb.from('trip_items').update({sort:it.sort}).eq('id',o.id)]);load();}
async function moveDay(id,dd){closeSheet();const n=dayItems(dd).length+1;const {error}=await sb.from('trip_items').update({day_date:dd,sort:n}).eq('id',id);if(error)return toast(error.message);toast('Перенесено на '+fmt(dd));load();}
async function toggleDone(id){const it=items.find(x=>x.id===id);const nv=it.status==='done'?'plan':'done';await sb.from('trip_items').update({status:nv}).eq('id',id);toast(nv==='done'?'★ Отмечено: побывали':'Снова в планах');load();}
async function toggleBackup(id){closeSheet();const it=items.find(x=>x.id===id);await sb.from('trip_items').update({is_backup:!it.is_backup}).eq('id',id);load();}
async function delItem(id){closeSheet();if(!confirm('Убрать это место из поездки вместе с записями?'))return;await sb.from('trip_items').delete().eq('id',id);load();}
async function addItem(dd){const t=$('#newT').value.trim();if(!t)return;const {error}=await sb.from('trip_items').insert({day_date:dd,sort:dayItems(dd).length+1,title:t,is_backup:false,status:'plan',details:{}});if(error)return toast(error.message);load();}
async function loadStarter(){if(items.length&&!confirm('В базе уже есть карточки. Добавить стартовый план ещё раз?'))return;
  let r=await sb.from('trip_days').upsert(STARTER_DAYS,{onConflict:'day_date'});if(r.error)return toast('Дни: '+r.error.message);
  r=await sb.from('trip_items').insert(STARTER_ITEMS);if(r.error)return toast('Карточки: '+r.error.message);toast('Стартовый план загружен');load();}
function exportMD(){let md=`# Дубай, 31 октября — 7 ноября 2026\n\n`;days.forEach((d,i)=>{md+=`## День ${i+1}. ${d.weekday} ${fmt(d.day_date)} — ${d.title||''}\n${d.intro||''}\n\n`;dayItems(d.day_date).forEach(it=>{md+=`### ${it.title}${it.is_backup?' (на всякий случай)':''}${it.status==='done'?' ★ побывали':''}\n${it.time_label?'Время: '+it.time_label+'. ':''}${it.area?'Район: '+it.area+'. ':''}${it.subtitle||''}\n`;Object.entries(it.details||{}).forEach(([k,v])=>md+=`- ${k}: ${v}\n`);notes.filter(n=>n.item_id===it.id).forEach(n=>md+=`\n> **${n.author}**${n.rating?' · '+n.rating+'/5':''}: ${n.body||''}\n`);md+='\n';});});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='dubai-2026.md';a.click();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;openId=null;render();window.scrollTo(0,0)});
load();
</script></body></html>
